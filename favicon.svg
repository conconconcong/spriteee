<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 精灵主体渐变（青紫粉流动霓虹色） -->
    <linearGradient id="ghost-body-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- 精灵顶部柔和立体高光 -->
    <linearGradient id="ghost-highlight" x1="50%" y1="5%" x2="50%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 极简阴影仅作用于精灵主体自身，纯透明底 -->
    <filter id="ghost-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 纯透明背景，只有单个精灵主体 -->
  <g filter="url(#ghost-drop)">
    <!-- 精灵圆润躯体与波浪底边 -->
    <path d="M 256 56
             C 140 56, 76 142, 76 270
             L 76 416
             C 76 438, 100 452, 118 438
             C 142 418, 172 418, 196 438
             C 214 452, 242 452, 256 438
             C 270 452, 298 452, 316 438
             C 340 418, 370 418, 394 438
             C 412 452, 436 438, 436 416
             L 436 270
             C 436 142, 372 56, 256 56 Z"
          fill="url(#ghost-body-grad)"/>

    <!-- 顶部高光提亮层 -->
    <path d="M 256 60
             C 144 60, 80 144, 80 270
             L 80 320
             C 130 260, 382 260, 432 320
             L 432 270
             C 432 144, 368 60, 256 60 Z"
          fill="url(#ghost-highlight)"/>

    <!-- 极简灵动大眼睛（深色瞳孔） -->
    <ellipse cx="196" cy="242" rx="22" ry="32" fill="#0b0f19"/>
    <ellipse cx="316" cy="242" rx="22" ry="32" fill="#0b0f19"/>

    <!-- 眼睛纯白高光点 -->
    <circle cx="204" cy="228" r="10" fill="#ffffff"/>
    <circle cx="190" cy="254" r="4.5" fill="#ffffff"/>

    <circle cx="324" cy="228" r="10" fill="#ffffff"/>
    <circle cx="310" cy="254" r="4.5" fill="#ffffff"/>

    <!-- 可爱透亮腮红 -->
    <ellipse cx="152" cy="282" rx="15" ry="9" fill="#ffffff" opacity="0.4"/>
    <ellipse cx="360" cy="282" rx="15" ry="9" fill="#ffffff" opacity="0.4"/>

    <!-- 灵动小嘴巴 -->
    <path d="M 246 276 Q 256 286 266 276" stroke="#0b0f19" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
