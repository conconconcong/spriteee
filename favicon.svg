<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 背景平滑渐变 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- 精灵主体高光霓虹渐变 -->
    <linearGradient id="sprite-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- 精灵内发光柔和微光 -->
    <linearGradient id="sprite-glow-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 极简阴影 -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- 纯粹柔光 -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 外底：深邃圆角矩形 -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- 精灵阴影底托 -->
  <ellipse cx="256" cy="420" rx="110" ry="18" fill="#030712" opacity="0.6" filter="url(#core-glow)"/>

  <!-- 精灵主体 (极简饱满轮廓：圆润头部 + 3段柔和波浪底) -->
  <g filter="url(#soft-shadow)">
    <!-- 实体精灵 -->
    <path d="M 256 100
             C 170 100, 126 160, 126 250
             L 126 360
             C 126 374, 142 384, 154 374
             C 172 360, 194 360, 212 374
             C 226 384, 246 384, 256 374
             C 274 360, 296 360, 314 374
             C 328 384, 348 384, 358 374
             C 370 384, 386 374, 386 360
             L 386 250
             C 386 160, 342 100, 256 100 Z"
          fill="url(#sprite-body-grad)"/>

    <!-- 顶部高光层 -->
    <path d="M 256 102
             C 173 102, 128 160, 128 250
             L 128 300
             C 170 260, 342 260, 384 300
             L 384 250
             C 384 160, 339 102, 256 102 Z"
          fill="url(#sprite-glow-grad)"/>

    <!-- 极简灵动双眼 -->
    <g fill="#0f172a">
      <!-- 左眼 -->
      <ellipse cx="206" cy="232" rx="17" ry="24"/>
      <!-- 右眼 -->
      <ellipse cx="306" cy="232" rx="17" ry="24"/>
    </g>

    <!-- 眼睛高光 -->
    <g fill="#ffffff">
      <circle cx="212" cy="223" r="8"/>
      <circle cx="201" cy="242" r="3.5"/>
      <circle cx="312" cy="223" r="8"/>
      <circle cx="301" cy="242" r="3.5"/>
    </g>

    <!-- 极简可爱腮红 -->
    <g fill="#ffffff" opacity="0.35">
      <ellipse cx="172" cy="262" rx="12" ry="7"/>
      <ellipse cx="340" cy="262" rx="12" ry="7"/>
    </g>
  </g>

  <!-- 右上角极简 AI 魔法星光 -->
  <path d="M 404 112 Q 416 112 416 100 Q 416 112 428 112 Q 416 112 416 124 Q 416 112 404 112 Z" fill="#fef08a" filter="url(#core-glow)"/>
</svg>
