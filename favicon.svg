<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- 胶片视窗渐变 -->
    <linearGradient id="frame-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 精灵霓虹渐变 -->
    <linearGradient id="ghost-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- AI 闪光渐变 -->
    <linearGradient id="spark-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- 棋盘格 pattern 代表 Sprite 图透明通道 -->
    <pattern id="checker-pattern-a" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#1e293b" fill-opacity="0.45"/>
      <rect x="12" width="12" height="12" fill="#334155" fill-opacity="0.45"/>
      <rect y="12" width="12" height="12" fill="#334155" fill-opacity="0.45"/>
      <rect x="12" y="12" width="12" height="12" fill="#1e293b" fill-opacity="0.45"/>
    </pattern>

    <!-- 辉光滤镜 -->
    <filter id="glow-a" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 投影滤镜 -->
    <filter id="shadow-a" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 外底圆角矩形 -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad-a)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" stroke="rgba(255,255,255,0.14)" stroke-width="3"/>
  <rect width="512" height="512" rx="116" fill="url(#checker-pattern-a)"/>

  <!-- 胶卷/单行横排序列帧导轨 -->
  <g opacity="0.85">
    <!-- 帧格 1 (左后) -->
    <rect x="76" y="160" width="76" height="192" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="114" cy="184" r="5" fill="#64748b"/>
    <circle cx="114" cy="328" r="5" fill="#64748b"/>

    <!-- 帧格 2 (中左) -->
    <rect x="168" y="144" width="84" height="224" rx="16" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5"/>
    <circle cx="210" cy="170" r="5" fill="#38bdf8"/>
    <circle cx="210" cy="342" r="5" fill="#38bdf8"/>

    <!-- 帧格 3 (核心主视图/中右) -->
    <rect x="268" y="128" width="168" height="256" rx="20" fill="url(#frame-grad-a)" fill-opacity="0.2" stroke="url(#ghost-grad-a)" stroke-width="3.5" filter="url(#shadow-a)"/>
    
    <!-- 视频裁剪准星标记 -->
    <path d="M 284 148 L 298 148 M 284 148 L 284 162" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 420 148 L 406 148 M 420 148 L 420 162" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 284 364 L 298 364 M 284 364 L 284 350" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M 420 364 L 406 364 M 420 364 L 420 350" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 残影 1 (虚化小精灵拖尾) -->
  <path d="M 104 260 C 104 235 124 235 124 260 C 124 275 119 285 114 285 C 109 285 104 275 104 260 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- 残影 2 (中度虚化精灵) -->
  <path d="M 190 248 C 190 220 230 220 230 248 C 230 278 220 292 210 292 C 200 292 190 278 190 248 Z" fill="url(#ghost-grad-a)" opacity="0.55"/>

  <!-- 核心主体：发光主精灵 (跃出帧窗口) -->
  <g filter="url(#glow-a)">
    <!-- 主精灵躯体 -->
    <path d="M 302 236 C 302 184 402 184 402 236 C 402 290 382 322 368 316 C 356 310 352 322 342 322 C 332 322 326 312 316 316 C 304 320 302 290 302 236 Z" 
          fill="url(#ghost-grad-a)"/>
    
    <!-- 精灵大眼睛 -->
    <ellipse cx="334" cy="226" rx="9" ry="13" fill="#0f172a"/>
    <circle cx="337" cy="222" r="4.5" fill="#ffffff"/>

    <ellipse cx="370" cy="226" rx="9" ry="13" fill="#0f172a"/>
    <circle cx="373" cy="222" r="4.5" fill="#ffffff"/>

    <!-- 腮红与微笑 -->
    <circle cx="323" cy="238" r="6" fill="#f43f5e" opacity="0.6"/>
    <circle cx="381" cy="238" r="6" fill="#f43f5e" opacity="0.6"/>
    <path d="M 346 242 Q 352 248 358 242" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 魔法 AI 抠像星光 (Sparkle) -->
  <g filter="url(#glow-a)">
    <path d="M 424 120 Q 436 120 436 108 Q 436 120 448 120 Q 436 120 436 132 Q 436 120 424 120 Z" fill="url(#spark-grad-a)"/>
    <path d="M 264 340 Q 272 340 272 332 Q 272 340 280 340 Q 272 340 272 348 Q 272 340 264 340 Z" fill="#38bdf8"/>
  </g>

  <!-- 字母 S 极简点缀微线 -->
  <path d="M 80 94 L 120 94 A 16 16 0 0 1 136 110 L 136 110 A 16 16 0 0 1 120 126 L 96 126 A 16 16 0 0 0 80 142 L 80 142 A 16 16 0 0 0 96 158 L 136 158" 
        stroke="rgba(255,255,255,0.25)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
